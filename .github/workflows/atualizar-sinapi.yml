name: Atualizar SINAPI
on:
  schedule:
    - cron: '30 11 10-25 * *'→ Runs at 11:30, between day 10 and 25 of the month    # todo dia 10 a 25, 08:30 no horário de Brasília (a Caixa publica o mês anterior nesse período)
  workflow_dispatch:
    inputs:
      uf:
        description: 'Estado (sigla), ex.: MT, GO, SP'
        required: false
        default: 'MT'
      mes:
        description: 'Mês a trazer (AAAA-MM), ex.: 2025-03. Digite 12meses para os últimos 12. Vazio = o mais recente.'
        required: false
        default: ''
  push:
    paths:
      - 'entrada/*.zip'          # enviar o zip da Caixa para a pasta "entrada" também dispara a atualização
      - 'entrada/*.xls'          # planilhas da GOINFRA e do SICRO
      - 'entrada/*.xlsx'
permissions:
  contents: write
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install openpyxl xlrd py7zr
      - name: Gerar os arquivos do SINAPI
        env:
          MES: ${{ github.event.inputs.mes }}
          UF: ${{ github.event.inputs.uf }}
        run: |
          python sinapi_atualizar.py --uf "${UF:-MT}" ${MES:+--mes "$MES"}
